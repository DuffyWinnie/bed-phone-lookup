
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller openpyxl

      - name: Check source file
        run: |
          if (!(Test-Path "bed_phone_lookup.py")) {
            throw "找不到 bed_phone_lookup.py"
          }

      - name: Build EXE
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --icon=app.ico --name BedPhoneLookup bed_phone_lookup.py

      - name: Upload EXE
        uses: actions/upload-artifact@v5
        with:
          name: BedPhoneLookup-Windows
          path: dist/BedPhoneLookup.exe
